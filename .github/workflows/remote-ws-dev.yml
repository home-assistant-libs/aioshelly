name: Remote WebSocket Dev Check

on:
  push:
    branches:
      - feature/remote-websocket-transport

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff format
        run: uv run ruff format --check aioshelly/common.py aioshelly/rpc_device/__init__.py aioshelly/rpc_device/device.py aioshelly/rpc_device/wsrpc.py tests/rpc_device/test_wsserver.py tests/test_common.py
      - name: Ruff lint
        run: uv run ruff check aioshelly/common.py aioshelly/rpc_device/__init__.py aioshelly/rpc_device/device.py aioshelly/rpc_device/wsrpc.py tests/rpc_device/test_wsserver.py tests/test_common.py
      - name: Type check
        run: uv run ty check
      - name: Tests
        run: uv run pytest -q tests/rpc_device/test_wsserver.py tests/test_common.py
